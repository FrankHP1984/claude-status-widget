name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    # El proyecto es Windows-only: window_focus depende de pywin32 y de los
    # atajos de Windows Terminal.
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar tests
        run: python -m pytest

  plugin-opencode:
    # El plugin de OpenCode es JavaScript y se prueba con el runner
    # integrado de Node, sin dependencias adicionales.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ejecutar tests del plugin
        run: node --test tests/opencode/plugin.test.mjs
