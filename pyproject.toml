[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-status-widget"
version = "0.1.0"
description = "Panel flotante para Windows que muestra el estado de las sesiones de Claude Code"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "FrankHP1984" }]
keywords = ["claude", "claude-code", "widget", "windows", "status"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://github.com/FrankHP1984/claude-status-widget"
Issues = "https://github.com/FrankHP1984/claude-status-widget/issues"

[tool.setuptools]
packages = ["claude_status_widget"]
